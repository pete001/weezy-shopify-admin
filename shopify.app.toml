# A separate Shopify-hosted admin app. Link its client ID with `shopify app config link`.
client_id = "c8b5010b040484d54130f9b178ea7217"
name = "Weezy Pop App Editor"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = false

